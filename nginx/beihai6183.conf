# 北海渔船矢量切片网关
# 源文件部署位置：/data/ltgk/beihai/nginx/beihai6183.conf
# Nginx 加载位置：/etc/nginx/conf.d/beihai6183.conf（直接复制，不使用软连接）
# 说明：前端已经独立部署，本文件只对外发布 PostGIS 动态矢量切片服务。

server {
    listen 6183;
    server_name _;

    charset utf-8;

    # 根地址跳转到健康检查，不再依赖 html 或 dist 目录。
    location = / {
        return 302 /vessel-tiles/health;
    }

    # 渔船健康检查和 MVT 请求。例如：
    # /vessel-tiles/health
    # /vessel-tiles/tileserver/mvt/cache?z=10&x=822&y=449&offlineHours=2
    location /vessel-tiles/ {
        proxy_pass http://127.0.0.1:7800/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,Cache-Control,If-None-Match" always;
        add_header X-Content-Type-Options "nosniff" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # 未定义的其他路径直接返回 404，不在本端口发布前端静态资源。
    location / {
        return 404;
    }
}
